<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Prawal Sharma — Technology Manager · AI-Driven Engineering Leader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.55" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#1f0f1a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e5383b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e5383b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#e5383b"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <style>
      .name { font: 800 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f3ef; letter-spacing: 1px; }
      .role { font: 500 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9cbd6; letter-spacing: 0.5px; }
      .chip { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #e8e9f1; letter-spacing: 1.5px; }
      .chipbox { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.16; }
      .orbA { animation: drift 9s ease-in-out infinite alternate; }
      .orbB { animation: drift 11s ease-in-out infinite alternate-reverse; }
      .node { animation: pulse 3.2s ease-in-out infinite; }
      .node:nth-of-type(2) { animation-delay: .8s; } .node:nth-of-type(3) { animation-delay: 1.6s; } .node:nth-of-type(4) { animation-delay: 2.4s; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-40px, 18px); } }
      @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .orbA, .orbB, .node { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle class="orbA" cx="1010" cy="70" r="230" fill="url(#glowA)"/>
  <circle class="orbB" cx="860" cy="260" r="210" fill="url(#glowB)"/>

  <!-- a small "system graph" on the right: services connected by edges -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <path d="M900 110 L990 80 L1080 130 L1010 200 L900 110 Z"/>
    <path d="M990 80 L1010 200"/>
    <path d="M1080 130 L1130 210"/>
  </g>
  <g fill="#f5f3ef">
    <circle class="node" cx="900" cy="110" r="6"/>
    <circle class="node" cx="990" cy="80" r="6"/>
    <circle class="node" cx="1080" cy="130" r="6"/>
    <circle class="node" cx="1010" cy="200" r="6"/>
    <circle cx="1130" cy="210" r="4" fill-opacity="0.6"/>
  </g>

  <text x="64" y="128" class="name">Prawal Sharma</text>
  <rect x="66" y="148" width="120" height="4" rx="2" fill="url(#rule)"/>
  <text x="64" y="192" class="role">Technology Manager · AI-Driven Engineering Leader · Cloud &amp; Scalable Systems</text>

  <g transform="translate(64 220)">
    <rect class="chipbox" width="132" height="34" rx="17"/>
    <text class="chip" x="66" y="22" text-anchor="middle">10 YEARS</text>
    <rect class="chipbox" x="146" width="176" height="34" rx="17"/>
    <text class="chip" x="234" y="22" text-anchor="middle">LLMs · AGENTS</text>
    <rect class="chipbox" x="336" width="200" height="34" rx="17"/>
    <text class="chip" x="436" y="22" text-anchor="middle">AWS · AZURE · GCP</text>
    <rect class="chipbox" x="550" width="196" height="34" rx="17"/>
    <text class="chip" x="648" y="22" text-anchor="middle">CLAUDE CERTIFIED</text>
  </g>
</svg>
